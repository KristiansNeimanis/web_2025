    <h1>Kalkulators</h1>

    <label for="num1">First number:</label>
    <input type="number" name="num1" id="num1" placeholder="0" />
    <label for="operator">Operator:</label>
    <input type="text" name="operator" id="operator" placeholder="+, -, /, *" />
    <label for="num2">Second number:</label>
    <input type="number" name="num2" id="num2" placeholder="0" />

    <button id="btn_cal">Calculate</button>

    <script>
      const btnCal = document.getElementById("btn_cal");
      //const btnCal = document.querySelector("btn_cal");

      const firstNumInput = document.getElementById("num1");
      const secondNumInput = document.getElementById("num2");
      const operatorInput = document.getElementById("operator");

      btnCal.addEventListener("click", handelClick);

      function handelClick() {
        let firstNumValue = Number(firstNumInput.value);
        let secondNumValue = Number(secondNumInput.value);
        let operatorValue = operatorInput.value;

        function calculateRes(n1, n2, op) {
          switch (op) {
            case "+":
              return n1 + n2;

            case "-":
              return n1 - n2;

            case "*":
              return n1 * n2;

            case "/":
              if (n1 == 0 || n2 == 0) {
                console.log("Cant devide by 0");
                break;
              }
              return n1 / n2;
            default:
              return "Unkown operator";
          }
        }
      }
